<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>APAC Statutory Benefits Monitor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f1419; --surface: #1a2332; --surface-2: #243044; --border: #2d3a4f;
      --text: #e8edf4; --text-muted: #8b9cb3; --accent: #0d9488; --accent-light: #2dd4bf;
      --green: #22c55e; --radius: 10px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "DM Sans", system-ui, sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; min-height: 100vh; }
    .header { background: linear-gradient(135deg, #0a2826 0%, #1a3d44 50%, #0f1419 100%); border-bottom: 1px solid var(--border); padding: 1.5rem 2rem; position: sticky; top: 0; z-index: 50; }
    .header-inner { max-width: 1400px; margin: 0 auto; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 1rem; align-items: flex-start; }
    .logo-block h1 { font-size: 1.35rem; font-weight: 700; }
    .logo-block h1 span { color: var(--accent-light); }
    .logo-block p { color: var(--text-muted); font-size: 0.875rem; margin-top: 0.25rem; }
    .header-meta { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; }
    .badge { font-size: 0.75rem; padding: 0.35rem 0.75rem; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); color: var(--text-muted); }
    .badge.live { color: var(--green); border-color: rgba(34,197,94,.35); }
    .lang-switch { display: flex; gap: 4px; border: 1px solid var(--border); border-radius: 999px; padding: 2px; background: var(--surface-2); }
    .lang-switch button { border: 0; background: transparent; color: var(--text-muted); font: inherit; font-size: 0.75rem; padding: 0.35rem 0.65rem; border-radius: 999px; cursor: pointer; }
    .lang-switch button.active { background: var(--accent); color: #fff; font-weight: 600; }
    .container { max-width: 1400px; margin: 0 auto; padding: 1.5rem 2rem 3rem; }
    .intro-banner { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem 1.15rem; font-size: 0.84rem; color: var(--text-muted); margin-bottom: 1.25rem; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1rem; margin-bottom: 1.25rem; }
    .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem; }
    .stat-card .label { font-size: 0.72rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; }
    .stat-card .value { font-size: 1.6rem; font-weight: 700; margin-top: 0.25rem; color: var(--accent-light); }
    .toolbar { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-bottom: 1rem; }
    .toolbar input, .toolbar select { background: var(--surface-2); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 0.5rem 0.75rem; font: inherit; font-size: 0.85rem; }
    .toolbar input { flex: 1; min-width: 200px; }
  </style>
  <style>
    .tabs { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1rem; }
    .tab-btn { border: 1px solid var(--border); background: var(--surface); color: var(--text-muted); padding: 0.5rem 1rem; border-radius: 999px; cursor: pointer; font: inherit; font-size: 0.85rem; }
    .tab-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
    .panel { display: none; }
    .panel.active { display: block; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    .card-header { padding: 1rem 1.25rem; border-bottom: 1px solid var(--border); }
    .card-header h2 { font-size: 1rem; }
    .card-header .sub { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.35rem; }
    .table-wrap { overflow: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
    th, td { border-bottom: 1px solid var(--border); padding: 0.55rem 0.65rem; vertical-align: top; text-align: left; }
    th { background: var(--surface-2); color: var(--text-muted); font-weight: 600; position: sticky; top: 0; }
    tr.hidden { display: none; }
    .topic-col { min-width: 140px; font-weight: 600; color: var(--accent-light); }
    .market-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1rem; padding: 1.25rem; }
    .market-card { border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem; background: var(--surface-2); }
    .market-card.hidden { display: none; }
    .market-card h3 { font-size: 0.95rem; margin-bottom: 0.75rem; display: flex; align-items: center; gap: 0.5rem; }
    .ben-row { margin-bottom: 0.65rem; font-size: 0.82rem; color: var(--text-muted); }
    .ben-row strong { color: var(--text); font-size: 0.78rem; display: block; margin-bottom: 0.15rem; }
    .source-links { padding: 1.25rem; display: flex; flex-direction: column; gap: 0.75rem; }
    .source-market { font-weight: 600; color: var(--text); margin-bottom: 0.25rem; }
    .source-links a { color: var(--accent-light); font-size: 0.84rem; }
    .footer { max-width: 1400px; margin: 0 auto; padding: 1.5rem 2rem 2rem; border-top: 1px solid var(--border); font-size: 0.78rem; color: var(--text-muted); }
    .hub-footer { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 0.75rem; }
    .hub-footer a { color: var(--accent-light); }
  </style>
  <script src="js/benefits-lang.js"></script>
  <script src="js/benefits-data.js"></script>
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <div class="logo-block">
        <h1>APAC <span>Statutory Benefits</span> Monitor</h1>
        <p id="ui-subtitle"></p>
      </div>
      <div class="header-meta">
        <div class="lang-switch" id="lang-switch" role="group" aria-label="Language">
          <button type="button" data-lang="zh" class="active">中文</button>
          <button type="button" data-lang="en">EN</button>
        </div>
        <span class="badge live" id="ui-live"></span>
        <span class="badge" id="lastUpdated">2026-11-24</span>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="intro-banner" id="ui-intro"></div>
    <section class="stats-grid" id="statsGrid"></section>
    <div class="toolbar">
      <input type="search" id="searchInput" placeholder="" />
      <select id="countryFilter"><option value=""></option></select>
      <select id="categoryFilter"><option value=""></option></select>
    </div>
    <nav class="tabs">
      <button class="tab-btn active" data-tab="matrix" id="ui-tab-matrix"></button>
      <button class="tab-btn" data-tab="markets" id="ui-tab-markets"></button>
      <button class="tab-btn" data-tab="sources" id="ui-tab-sources"></button>
    </nav>
    <section class="panel active" id="panel-matrix">
      <div class="card">
        <div class="card-header">
          <h2 id="ui-matrix-h2"></h2>
          <p class="sub" id="ui-matrix-sub"></p>
        </div>
        <div class="card-body table-wrap">
          <table id="matrixTable"><thead id="matrixHead"></thead><tbody id="matrixBody"></tbody></table>
        </div>
      </div>
    </section>
    <section class="panel" id="panel-markets">
      <div class="card">
        <div class="card-header"><h2 id="ui-markets-h2"></h2></div>
        <div class="market-grid" id="marketGrid"></div>
      </div>
    </section>
    <section class="panel" id="panel-sources">
      <div class="card">
        <div class="card-header"><h2 id="ui-sources-h2"></h2></div>
        <div class="source-links" id="sourcePanel"></div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <span id="ui-foot"></span>
    <div class="hub-footer">
      <a href="https://roqianebay.github.io/apac-labor-hr-practice/er-dashboards.html" id="ui-hub-index">看板总索引</a>
      <a href="https://roqianebay.github.io/apac-labor-hr-practice/" id="ui-hub-labor">流程与劳动法</a>
    </div>
  </footer>

  <script>
    const MARKETS = window.BENEFIT_MARKETS;
    const CATS = window.BENEFIT_CATEGORIES;

    function getFilter() {
      return {
        q: (document.getElementById("searchInput").value || "").trim().toLowerCase(),
        country: document.getElementById("countryFilter").value,
        category: document.getElementById("categoryFilter").value
      };
    }

    function matchItem(text, f) {
      if (f.country && !text.includes(f.country)) return false;
      return !f.q || text.toLowerCase().includes(f.q);
    }

    function renderStats() {
      const BL = window.BenefitsLang;
      const rows = MARKETS.reduce((n, m) => n + m.items.length, 0);
      document.getElementById("statsGrid").innerHTML = `
        <div class="stat-card"><div class="label">${BL ? BL.t(BL.UI.statMarkets) : "Markets"}</div><div class="value">${MARKETS.length}</div></div>
        <div class="stat-card"><div class="label">${BL ? BL.t(BL.UI.statTopics) : "Topics"}</div><div class="value">${CATS.length}</div></div>
        <div class="stat-card"><div class="label">${BL ? BL.t(BL.UI.statRows) : "Rows"}</div><div class="value">${rows}</div></div>`;
    }

    function fillFilters() {
      const BL = window.BenefitsLang;
      const cf = document.getElementById("countryFilter");
      const catf = document.getElementById("categoryFilter");
      const cVal = cf.value;
      const catVal = catf.value;
      cf.innerHTML = `<option value="">${BL ? BL.t(BL.UI.filterMarket) : "All"}</option>` +
        MARKETS.map(m => `<option value="${m.code}">${BL ? BL.marketName(m) : m.nameZh}</option>`).join("");
      catf.innerHTML = `<option value="">${BL ? BL.t(BL.UI.filterCat) : "All cats"}</option>` +
        CATS.map(c => `<option value="${c.id}">${BL ? BL.t(c.label) : c.id}</option>`).join("");
      cf.value = cVal;
      catf.value = catVal;
    }

    function renderMatrix(f) {
      const BL = window.BenefitsLang;
      const head = document.getElementById("matrixHead");
      const body = document.getElementById("matrixBody");
      const topicL = BL ? BL.t(BL.UI.colTopic) : "Category";
      head.innerHTML = `<tr><th class="topic-col">${topicL}</th>${MARKETS.map(m =>
        `<th>${m.flag} ${BL ? BL.marketName(m) : m.nameZh}</th>`).join("")}</tr>`;
      body.innerHTML = CATS.map(cat => {
        const rowText = MARKETS.map(m => {
          const it = m.items.find(x => x.cat === cat.id);
          return it ? (BL ? BL.itemField(it, "summary") : it.summary) : "—";
        }).join(" ");
        const hideRow = (f.category && f.category !== cat.id) || (f.q && !rowText.toLowerCase().includes(f.q));
        const cells = MARKETS.map(m => {
          if (f.country && f.country !== m.code) return "<td>—</td>";
          const it = m.items.find(x => x.cat === cat.id);
          if (!it) return "<td>—</td>";
          return `<td>${BL ? BL.itemField(it, "summary") : it.summary}</td>`;
        }).join("");
        return `<tr class="${hideRow ? "hidden" : ""}"><td class="topic-col">${BL ? BL.catLabel(cat.id) : cat.id}</td>${cells}</tr>`;
      }).join("");
    }

    function renderMarkets(f) {
      const BL = window.BenefitsLang;
      document.getElementById("marketGrid").innerHTML = MARKETS.map(m => {
        const blob = JSON.stringify(m).toLowerCase();
        const matchC = !f.country || f.country === m.code;
        const matchQ = !f.q || blob.includes(f.q);
        const rows = m.items.filter(it => !f.category || f.category === it.cat).map(it => {
          const lab = BL ? BL.catLabel(it.cat) : it.cat;
          const sum = BL ? BL.itemField(it, "summary") : it.summary;
          return `<div class="ben-row"><strong>${lab}</strong>${sum}</div>`;
        }).join("");
        const hidden = !(matchC && matchQ && rows) ? "hidden" : "";
        return `<article class="market-card ${hidden}"><h3>${m.flag} ${BL ? BL.marketName(m) : m.nameZh}</h3>${rows || '<div class="ben-row">—</div>'}</article>`;
      }).join("");
    }

    function renderSources() {
      const BL = window.BenefitsLang;
      const ref = BL ? BL.t(BL.UI.refLabel) : "Links";
      document.getElementById("sourcePanel").innerHTML = MARKETS.map(m =>
        `<div><div class="source-market">${m.flag} ${BL ? BL.marketName(m) : m.nameZh}</div>` +
        (m.sources || []).map(s => {
          const t = BL && s.titleEn && BL.lang === "en" ? s.titleEn : s.title;
          return `<a href="${s.url}" target="_blank" rel="noopener noreferrer">${ref}: ${t}</a>`;
        }).join("<br>") + "</div>"
      ).join("");
    }

    function applyFilters() {
      const f = getFilter();
      renderMatrix(f);
      renderMarkets(f);
    }
    window.renderStats = renderStats;
    window.applyFilters = applyFilters;
    window.renderSources = renderSources;

    document.querySelectorAll(".tab-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
        document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById("panel-" + btn.dataset.tab).classList.add("active");
      });
    });
    ["searchInput", "countryFilter", "categoryFilter"].forEach(id => {
      const el = document.getElementById(id);
      el.addEventListener("input", applyFilters);
      el.addEventListener("change", () => { fillFilters(); applyFilters(); });
    });

    window.fillBenefitFilters = fillFilters;
    if (window.BenefitsLang) BenefitsLang.init();
    else { renderStats(); applyFilters(); renderSources(); }
  </script>
</body>
</html>
